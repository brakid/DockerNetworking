name: networking

services:
    database:
        image: redis:alpine
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=secret
        networks:
            - backend
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
    service:
        build: ./service
        image: networking-service
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=secret
            - QUEUE_NAME=messages
            - TIMESERIES=messages:count
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        ports:
            - 0.0.0.0:3000:3000
        networks:
            - backend
            - frontend
    ui:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./website:/usr/share/nginx/html:ro
        depends_on:
            - service
        ports:
            - 0.0.0.0:8080:80
        networks:
            - frontend
    rabbitmq:
        image: rabbitmq:4-alpine
        restart: unless-stopped
        networks:
            - backend
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s

    worker:
        build: ./worker
        image: networking-worker
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=secret
            - QUEUE_NAME=messages
            - PYTHONUNBUFFERED=1
        deploy:
            replicas: 3
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - backend

    metrics:
        build: ./metrics
        image: networking-metrics
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=secret
            - QUEUE_NAME=messages
            - TIMESERIES=messages:count
            - PYTHONUNBUFFERED=1
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - backend

networks:
    backend:
        internal: true
        ipam:
            config:
                - subnet: 172.16.0.0/24
    frontend:
        ipam:
            config:
                - subnet: 172.16.1.0/24
                  gateway: 172.16.1.254

