<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1e8449"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="1050" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="46" font-size="26" font-weight="bold" fill="#1a1a1a">Docker Compose project &#8220;networking&#8221; &#8212; component communication</text>
  <text x="40" y="72" font-size="14" fill="#666">Main flow: Browser &#8594; service &#8594; RabbitMQ &#8594; worker &#8594; Redis &#8594; service &#8594; Browser   &#183;   Metrics flow: RabbitMQ &#8594; metrics &#8594; Redis TimeSeries &#8594; service &#8594; Browser</text>

  <!-- ================= networks ================= -->
  <!-- frontend network -->
  <rect x="40" y="240" width="500" height="700" rx="16" fill="#eef5fd" stroke="#4a90d9" stroke-width="2"/>
  <text x="60" y="268" font-size="15" font-weight="bold" fill="#1f6fb2">frontend network &#183; 172.16.1.0/24</text>
  <text x="60" y="288" font-size="12" fill="#1f6fb2">reachable from outside / has internet</text>

  <!-- backend network -->
  <rect x="440" y="240" width="720" height="700" rx="16" fill="#fdf4ec" stroke="#d9822b" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1140" y="268" font-size="15" font-weight="bold" text-anchor="end" fill="#a5611a">backend network &#183; 172.16.0.0/24</text>
  <text x="1140" y="288" font-size="12" text-anchor="end" fill="#a5611a">internal: true &#8212; no internet, no exposed ports</text>

  <!-- ================= nodes ================= -->
  <!-- browser -->
  <rect x="60" y="108" width="230" height="86" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
  <text x="175" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Client (Browser)</text>
  <text x="175" y="157" font-size="12" text-anchor="middle" fill="#555">runs website/script.js</text>
  <text x="175" y="176" font-size="12" text-anchor="middle" fill="#888">(user&#8217;s machine, outside Docker)</text>

  <!-- ui -->
  <rect x="110" y="330" width="220" height="92" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
  <text x="220" y="358" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ui</text>
  <text x="220" y="379" font-size="12" text-anchor="middle" fill="#555">nginx:alpine &#8212; static site</text>
  <text x="220" y="398" font-size="12" text-anchor="middle" fill="#888">host port 8080 &#8594; 80</text>

  <!-- service (straddles both networks) -->
  <rect x="380" y="430" width="220" height="116" rx="10" fill="#ffffff" stroke="#2c3e50" stroke-width="2.4"/>
  <text x="490" y="458" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">service</text>
  <text x="490" y="479" font-size="12" text-anchor="middle" fill="#555">Bun 1.4 (TypeScript) REST API</text>
  <text x="490" y="498" font-size="12" text-anchor="middle" fill="#888">/trigger &#183; /result/:id &#183; /messages</text>
  <text x="490" y="517" font-size="12" text-anchor="middle" fill="#888">host port 3000 &#8594; 3000</text>
  <text x="490" y="536" font-size="11" font-style="italic" text-anchor="middle" fill="#2c3e50">member of BOTH networks</text>

  <!-- database -->
  <rect x="770" y="310" width="250" height="96" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
  <text x="895" y="338" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">database</text>
  <text x="895" y="359" font-size="12" text-anchor="middle" fill="#555">Redis (alpine) :6379</text>
  <text x="895" y="378" font-size="12" text-anchor="middle" fill="#888">counter, results &amp; TimeSeries</text>
  <text x="895" y="396" font-size="11" font-style="italic" text-anchor="middle" fill="#999">healthcheck: redis-cli ping</text>

  <!-- rabbitmq -->
  <rect x="770" y="440" width="250" height="96" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
  <text x="895" y="468" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">rabbitmq</text>
  <text x="895" y="489" font-size="12" text-anchor="middle" fill="#555">RabbitMQ 4 (alpine) :5672</text>
  <text x="895" y="508" font-size="12" text-anchor="middle" fill="#888">quorum queue &#8220;messages&#8221;</text>
  <text x="895" y="526" font-size="11" font-style="italic" text-anchor="middle" fill="#999">healthcheck: rabbitmq-diagnostics</text>

  <!-- worker -->
  <rect x="770" y="570" width="250" height="106" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
  <text x="895" y="598" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">worker &#215; 3 replicas</text>
  <text x="895" y="619" font-size="12" text-anchor="middle" fill="#555">Python 3.14 + pika/redis</text>
  <text x="895" y="638" font-size="12" text-anchor="middle" fill="#888">consumes queue, writes result</text>
  <text x="895" y="658" font-size="11" font-style="italic" text-anchor="middle" fill="#999">round-robin, prefetch = 1</text>

  <!-- metrics -->
  <rect x="770" y="710" width="250" height="106" rx="10" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="895" y="738" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">metrics</text>
  <text x="895" y="759" font-size="12" text-anchor="middle" fill="#555">Python 3.14 + schedule</text>
  <text x="895" y="778" font-size="12" text-anchor="middle" fill="#888">polls queue depth &#8594; 1&#215;/s</text>
  <text x="895" y="798" font-size="11" font-style="italic" text-anchor="middle" fill="#1e8449">backend only &#183; build-metrics.sh</text>

  <!-- ================= edges ================= -->
  <!-- browser -> ui -->
  <path d="M 160 194 L 195 330" stroke="#2c3e50" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- browser -> service -->
  <path d="M 290 152 Q 460 175 470 430" stroke="#1f6fb2" stroke-width="1.8" fill="none" marker-end="url(#arrowblue)"/>

  <!-- service -> redis -->
  <path d="M 600 452 L 770 380" stroke="#2c3e50" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- service -> rabbitmq -->
  <path d="M 600 512 L 770 492" stroke="#2c3e50" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- rabbitmq -> worker -->
  <path d="M 895 536 L 895 570" stroke="#2c3e50" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- worker -> redis -->
  <path d="M 770 618 C 672 618, 690 470, 786 410" stroke="#2c3e50" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- metrics -> rabbitmq (poll queue depth) -->
  <path d="M 1020 725 C 1085 725, 1088 600, 1012 538" stroke="#1e8449" stroke-width="1.8" fill="none" marker-end="url(#arrowgreen)"/>

  <!-- metrics -> redis (TS.ADD) -->
  <path d="M 1020 755 C 1145 755, 1150 470, 1021 372" stroke="#1e8449" stroke-width="1.8" fill="none" marker-end="url(#arrowgreen)"/>

  <!-- ================= edge labels ================= -->
  <rect x="30" y="222" width="180" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="36" y="237" font-size="12" fill="#2c3e50">GET :8080 &#8212; HTML + JS</text>

  <rect x="452" y="285" width="240" height="54" fill="#ffffff" opacity="0.92"/>
  <text x="458" y="302" font-size="12" fill="#1f6fb2">fetch localhost:3000</text>
  <text x="458" y="318" font-size="12" fill="#1f6fb2">/trigger &#183; /result/:id &#183; /messages</text>
  <text x="458" y="334" font-size="12" fill="#1f6fb2">(retry w/ backoff, /messages 1&#215;/s)</text>

  <rect x="608" y="392" width="160" height="38" fill="#ffffff" opacity="0.92"/>
  <text x="612" y="407" font-size="12" fill="#2c3e50">INCR ids &#183; GET id-{id}</text>
  <text x="612" y="423" font-size="12" fill="#2c3e50">TS.REVRANGE (10 pts)</text>

  <rect x="608" y="486" width="158" height="20" fill="#ffffff" opacity="0.92"/>
  <text x="612" y="501" font-size="12" fill="#2c3e50">publish {id} &#8594; queue</text>

  <rect x="795" y="543" width="160" height="20" fill="#ffffff" opacity="0.92"/>
  <text x="799" y="558" font-size="12" fill="#2c3e50">consume (1 msg each)</text>

  <rect x="606" y="560" width="132" height="20" fill="#ffffff" opacity="0.92"/>
  <text x="610" y="575" font-size="12" fill="#2c3e50">SET id-{id} result</text>

  <rect x="1022" y="551" width="88" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="1026" y="564" font-size="11" fill="#1e8449">depth every 1s</text>

  <rect x="1044" y="733" width="116" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="1048" y="746" font-size="11" fill="#1e8449">TS.ADD every 1s</text>

  <!-- ================= notes ================= -->
  <text x="40" y="966" font-size="12" fill="#1e8449">* metrics polls the RabbitMQ queue depth every second and records it in the Redis TimeSeries &#8220;messages:count&#8221; (24 h retention); the service exposes it at GET /messages.</text>
  <text x="40" y="986" font-size="12" fill="#a5611a">* Redis, RabbitMQ, worker and metrics live ONLY in the internal backend network &#8212; unreachable from users&#8217; browsers.</text>
  <text x="40" y="1006" font-size="12" fill="#666">* depends_on + healthchecks: service, worker &amp; metrics wait for Redis and RabbitMQ to report healthy before starting.</text>
  <text x="40" y="1026" font-size="12" fill="#666">* Docker round-robins incoming queue messages across the 3 worker replicas; each worker sleeps 1s to simulate work.</text>
</svg>
